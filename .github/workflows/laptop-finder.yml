name: Laptop Finder monitor & deploy

on:
  push:
    branches: [main, arena/01a03632-laptop-finder]
  schedule:
    # the 24/7 heartbeat — scrape every tracked website every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for the real-browser scraper
        run: npx playwright install --with-deps chromium
      - name: Scrape all tracked websites
        env:
          PLAYWRIGHT: "1"
        run: node scripts/cron-scrape.mjs
      - name: Commit price snapshot
        run: |
          git config user.name "laptop-finder-monitor[bot]"
          git config user.email "monitor@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "no price changes — nothing to commit"
          else
            git commit -m "monitor: price snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

  deploy:
    needs: monitor
    if: ${{ always() && (needs.monitor.result == 'success' || needs.monitor.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
